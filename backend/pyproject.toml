[project]
name = "paperaid-api"
version = "2.0.0"
description = "PaperAid Pro backend API: scholarly discovery, library, documents, citations and grounded AI research tools."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "httpx>=0.28",
  "google-auth>=2.36",
  "requests>=2.32",
  "python-multipart>=0.0.18",
  "pypdf>=5.1",
  "lxml>=5.3",
  "python-docx>=1.1",
  "fpdf2>=2.8",
  "nh3>=0.2.18",
  "bibtexparser>=1.4,<2",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "pgserver>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live: hits real external scholarly APIs (opt-in with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
